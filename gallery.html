
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css?family=Pixelify+Sans" rel="stylesheet">
    <link rel="icon" href="assets/icon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="gallery.css">

    <title>Patterns in the Modern World</title>
</head>

<body class="no-scrollbar">

    <div class="cursor"></div>

    <!-- NAVIGATION BAR -->

    <header class="nav-header">

        <h1 class="site-logo">
            <a href="index.html">
                <img src="assets/site-logo.png" alt="patterns in the modern world">
            </a>
        </h1>

        <ul>
            <li><a href="index.html">home</a></li>
            <li><a class="active" href="gallery.html">gallery</a></li>
            <li><a href="pattern_generator.html">pattern generator</a></li>
        </ul>

    </header>

    <script src="cursor.js"></script>


    <!-- GALLERY LAYOUT -->

    <div class="page-layout">

        <div id="container">

            <!-- GALLERY TITLE BAR -->

            <div class="title-bar">

                <span class="title-bar-text">gallery</span>

                <div class="title-bar-controls" aria-hidden="true">
                    <span class="title-btn minimize"></span>
                    <span class="title-btn maximize"></span>
                    <span class="title-btn close">x</span>
                </div>

            </div>


            <!-- FILTER BUTTONS -->

            <div class="gallery-filter">

                Filter by:

                <button class="filter-btn active" data-filter="all">
                    All
                </button>

                <button class="filter-btn" data-filter="translation">
                    Translation
                </button>

                <button class="filter-btn" data-filter="reflection">
                    Reflection
                </button>

                <button class="filter-btn" data-filter="rotation">
                    Rotation
                </button>

                <button class="filter-btn" data-filter="dilation">
                    Dilation
                </button>

            </div>


            <!-- GALLERY IMAGES -->

            <div class="gallery">


                <!-- DILATION -->

                <div class="gallery-item"
                    data-category="dilation"
                    data-title="Dilation Pattern - ALB Pond"
                    data-description="The subject in the photo contains a dilation pattern, as the triangles rotate around an object in the middle and VARY in size. The photo was taken in the library of UA&P pointing down into the ALB pond.">

                    <img src="images/dilation-ALB_pond (2).png"
                        alt="Dilation pattern - ALB Pond"
                        loading="lazy"
                        decoding="async">

                </div>


                <div class="gallery-item"
                    data-category="dilation"
                    data-title="Dilation Pattern - SM Grocery"
                    data-description="The object in this photo displays a dilation pattern because each succeeding shape on the bottle decreases in size from top to bottom. This photo was taken in SM Megamall grocery.">

                    <img src="images/dilation-SMGrocery (2).JPG"
                        alt="Dilation pattern - SM Grocery"
                        loading="lazy"
                        decoding="async">

                </div>


                <div class="gallery-item"
                    data-category="dilation"
                    data-title="Dilation Pattern - Vent ACB"
                    data-description="The object in this photo displays a dilation pattern because the vent has squares that increase in size outwards, starting from the middle. This photo was taken in the ACB building, UA&P.">

                    <img src="images/dilation-ventACB (2).JPG"
                        alt="Dilation pattern - Vent ACB"
                        loading="lazy"
                        decoding="async">

                </div>


                <!-- DILATION + TRANSLATION -->

                <div class="gallery-item"
                    data-category="dilation translation"
                    data-title="Dilation and Translation Pattern - ALB Gate"
                    data-description="The object in this photo displays a translation pattern because the squares are shown to be repeating and shifting a fixed distance from one another. This photo was taken in the ALB building, UA&P.">

                    <img src="images/dilationtranslation-ALBgate (2).JPG"
                        alt="Dilation and translation pattern - ALB Gate"
                        loading="lazy"
                        decoding="async">

                </div>


                <!-- REFLECTION -->

                <div class="gallery-item"
                    data-category="reflection translation"
                    data-title="Reflection Pattern - Building Behind KFC"
                    data-description="The object in this photo displays a reflection and a translation pattern because the windows are repeating and shifts to a certain direction while also being perfectly symmetrical with the axis of symmetry being in the middle of the building horizontally. This photo was taken near Pearl Drive, the building behind KFC.">

                    <img src="images/reflection-bldgbehindkfc (2).JPG"
                        alt="Reflection pattern - Building Behind KFC"
                        loading="lazy"
                        decoding="async">

                </div>


                <div class="gallery-item"
                    data-category="reflection"
                    data-title="Reflection Pattern - Car Megamall"
                    data-description="The grills on this car contain a reflection pattern that goes along the Y-axis. Each piece of metal can replace the opposite piece of metal’s place across the line of reflection in the middle, granted it is the correct order. This photo was taken in Megamall.">

                    <img src="images/reflection-CarMegamall (2).JPG"
                        alt="Reflection pattern - Car Megamall"
                        loading="lazy"
                        decoding="async">

                </div>


                <div class="gallery-item"
                    data-category="reflection"
                    data-title="Reflection Pattern - Chess MEGAC"
                    data-description="The object in this photo displays a reflection pattern because the set up in this big chess display is perfectly symmetrical, as all chess board set-ups are. The axis of symmetry is at the middle of the board horizontally. This photo was taken in SM Megamall.">

                    <img src="images/reflection-chessMEGAC (2).JPG"
                        alt="Reflection pattern - Chess MEGAC"
                        loading="lazy"
                        decoding="async">

                </div>


                <div class="gallery-item"
                    data-category="reflection"
                    data-title="Reflection Pattern - MEGAC Second Floor"
                    data-description="The object in this photo displays a reflection pattern since the lines meet at the center which acts as the axis of symmetry. This photo was taken at Megamall.">

                    <img src="images/reflection-MEGACsecondfloor (2).JPG"
                        alt="Reflection pattern - MEGAC Second Floor"
                        loading="lazy"
                        decoding="async">

                </div>


                <div class="gallery-item"
                    data-category="reflection"
                    data-title="Reflection Pattern - Ortigas Extension"
                    data-description="The object in this photo displays a reflection pattern because a chess board set-up is inherently symmetrical which then becomes a reflection. The axis of symmetry is at the middle of the board vertically. This photo was taken in St. Joseph subd., near Ortigas, ext.">

                    <img src="images/reflection-Ortigas extension, st. Joseph subd (chess) (2).jpg"
                        alt="Reflection pattern - Ortigas Extension"
                        loading="lazy"
                        decoding="async">

                </div>


                <!-- REFLECTION + TRANSLATION -->

                <div class="gallery-item"
                    data-category="reflection translation"
                    data-title="Reflection and Translation Pattern - MEGAC"
                    data-description="The object in this photo displays a translation pattern because the shapes shift to the right and then upwards which then shifts downwards again to repeat the pattern. This photo was taken at Megamall.">

                    <img src="images/reflectiontranslation-MEGAC (2).JPG"
                        alt="Reflection and translation pattern - MEGAC"
                        loading="lazy"
                        decoding="async">

                </div>


                <!-- ROTATION -->

                <div class="gallery-item"
                    data-category="rotation"
                    data-title="Rotation Pattern - Ortigas Extension"
                    data-description="The object in this photo displays a rotation pattern because the blades of the fan are rotated by a certain angle to create the pattern. This photo was taken in St. Joseph subd., near Ortigas ext.">

                    <img src="images/rotation-Ortigas extension, st. Joseph subd (2).jpg"
                        alt="Rotation pattern - Ortigas Extension"
                        loading="lazy"
                        decoding="async">

                </div>


                <div class="gallery-item"
                    data-category="rotation"
                    data-title="Rotation Pattern - Residencia 8888"
                    data-description="The tiles in the floor in this picture contain a rotation pattern. Each small tile that makes up a semi circle rotates along a midpoint which are overlapped by other semi circles to create a sophisticated pattern along the floor of RESIDENCIA 8888.">

                    <img src="images/rotation-residencia8888 (2).JPG"
                        alt="Rotation pattern - Residencia 8888"
                        loading="lazy"
                        decoding="async">

                </div>


                <div class="gallery-item"
                    data-category="rotation"
                    data-title="Rotation Pattern - Spiral Megamall Department Store"
                    data-description="This photo contains a rotation pattern manifesting in the form of a spiral. Each red and white piece can be rotated to each other's position by changing angle. This photo was taken in the Megamall department store.">

                    <img src="images/rotation-SpiralMegamallDepartmentStore (2).JPG"
                        alt="Rotation pattern - Spiral Megamall Department Store"
                        loading="lazy"
                        decoding="async">

                </div>


                <!-- TRANSLATION -->

                <div class="gallery-item"
                    data-category="translation"
                    data-title="Translation Pattern - UCAF Wall"
                    data-description="The wall in UA&P’s Cafeteria contains a translation pattern and it can be observed in each piece of wood with a ridge in between. Each piece of wood sticking out can take the place of another piece without rotating or changing sizes, which differentiates it from a rotation pattern">

                    <img src="images/rotation-UAPgate (2).JPG"
                        alt="Rotation pattern - UA&P Gate"
                        loading="lazy"
                        decoding="async">

                </div>


                <div class="gallery-item"
                    data-category="translation"
                    data-title="Translation Pattern - UCAF Wall"
                    data-description="A pattern formed by shifting identical shapes while preserving their original orientation.">

                    <img src="images/translation_wallUCAF (2).JPG"
                        alt="Translation pattern - UCAF Wall"
                        loading="lazy"
                        decoding="async">

                </div>


                <div class="gallery-item"
                    data-category="translation"
                    data-title="Translation Pattern - ACB Building Floor"
                    data-description="The tiles in this photo contain a translation pattern as you can move the triangles in place of triangles with the same color. This photo was taken on a floor in the ACB building.">

                    <img src="images/translation-ACB_buildingfloor (2).png"
                        alt="Translation pattern - ACB Building Floor"
                        loading="lazy"
                        decoding="async">

                </div>


                <div class="gallery-item"
                    data-category="translation"
                    data-title="Translation Pattern - Building Behind KFC"
                    data-description="The windows in this photo observes a translation pattern. Each window can take another window's place by simply moving down or to the side, without rotating, thus translating a generator. This was taken at the building behind KFC near UA&P.">

                    <img src="images/translation-bldgbehindkfc (2).JPG"
                        alt="Translation pattern - Building Behind KFC"
                        loading="lazy"
                        decoding="async">

                </div>


                <div class="gallery-item"
                    data-category="dilation"
                    data-title="Dilation Pattern - Ortigas Extension"
                    data-description="The object in this photo displays a dilation pattern because each succeeding mask increases in size. The photo was taken in St. Joseph subd., near Ortigas ext.">

                    <img src="images/translation-Ortigas extension, st. Joseph subd (2).jpg"
                        alt="Translation pattern - Ortigas Extension"
                        loading="lazy"
                        decoding="async">

                </div>


                <div class="gallery-item"
                    data-category="translation"
                    data-title="Translation Pattern - Ortigas Extension 02"
                    data-description="The leaf in this photo showcases a translation pattern. The pattern can be observed in the horizontal darker streaks in the leaf. The picture was taken in St. Joseph Subdivision">

                    <img src="images/translation-Ortigas extension, st. Joseph subd(1) (2).jpg"
                        alt="Translation pattern - Ortigas Extension 02"
                        loading="lazy"
                        decoding="async">

                </div>


            </div>

        </div>

    </div>


    <!-- RETRO IMAGE VIEWER -->

    <div class="image-viewer"
        id="imageViewer"
        role="dialog"
        aria-modal="true"
        aria-hidden="true"
        aria-label="Image viewer">

        <div class="viewer-window">

            <!-- VIEWER TITLE BAR -->

            <div class="title-bar">

                <span class="title-bar-text">image_viewer.exe</span>

                <div class="title-bar-controls">

                    <button class="title-btn close"
                        id="closeViewer">
                        x
                    </button>

                </div>

            </div>


            <!-- VIEWER CONTENT -->

            <div class="viewer-content">

                <!-- SELECTED IMAGE -->

                <div class="viewer-image-container">

                    <!-- PREVIOUS IMAGE -->

                    <button class="viewer-arrow viewer-arrow-left"
                        id="prevImage"
                        type="button"
                        aria-label="Previous image">

                        &#9664;

                    </button>


                    <!-- ENLARGED IMAGE -->

                    <img
                        id="selectedImage"
                        src=""
                        alt="Selected gallery image">


                    <!-- NEXT IMAGE -->

                    <button class="viewer-arrow viewer-arrow-right"
                        id="nextImage"
                        type="button"
                        aria-label="Next image">

                        &#9654;

                    </button>

                </div>


                <!-- IMAGE DESCRIPTION -->

                <div class="viewer-description">

                    <h2 id="imageTitle">
                        IMAGE TITLE
                    </h2>

                    <div class="description-divider"></div>

                    <p id="imageDescription">
                        Image description goes here.
                    </p>

                    <div class="image-category">

                        CATEGORY:

                        <span id="imageCategory">
                            TRANSLATION
                        </span>

                    </div>

                </div>

            </div>


            <!-- VIEWER FOOTER -->

            <div class="viewer-footer">

                <span class="viewer-hint">
                    USE THE ARROW KEYS TO BROWSE
                </span>

                <span id="imageCounter">
                    01 / 19
                </span>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="gallery.js"></script>

</body>
</html>
